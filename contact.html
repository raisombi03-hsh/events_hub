<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JNEC Events Hub — Contact</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Custom CSS (Must be last) -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header id="top">
    <h1>JNEC Events Hub</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="register.html">Register</a>
        <a href="gallery.html">Gallery</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main class="container py-4">
    <h2 class="mb-4">Contact Us</h2>

    <div class="row g-4">
        <section class="col-md-6">
            <h3>College Address</h3>
            <p>
                Jigme Namgyel Engineering College<br>
                Dewathang, Samdrup Jongkhar<br>
                Bhutan
            </p>
            <p><strong>Email:</strong> <a href="mailto:info@eventshub.edu.bt">info@eventshub.edu.bt</a></p>
            <p><strong>Phone:</strong> +975 12345678</p>

            <h3 class="mt-4">Our Location</h3>
            <div class="ratio ratio-16x9">
                <iframe
                    src="https://www.google.com/maps?q=Sarpang%20Bhutan&output=embed"
                    style="border:0;"
                    allowfullscreen
                    loading="lazy">
                </iframe>
            </div>
        </section>

        <section class="col-md-6">
            <h3>Enquiry Form</h3>
            <form action="#" method="post" class="p-3 border rounded bg-light">
                <div class="mb-3">
                    <label for="name" class="form-label">Name:</label>
                    <input type="text" id="name" name="name" class="form-field form-control" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" id="email" name="email" class="form-field form-control" required>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label">Message:</label>
                    <textarea id="message" name="message" rows="5" class="form-field form-control" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </section>
    </div>
</main>

<footer>
    <p>&copy; 2026 JNEC Events Hub</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
