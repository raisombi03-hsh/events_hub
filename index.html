<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JNEC Events Hub — Home</title>
    
    <!-- 1. Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- 2. Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- 3. Your Custom CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header id="top" class="bg-dark text-white p-3 mb-4">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <h1 class="h3 mb-2 mb-md-0">JNEC Events Hub</h1>
            <nav>
                <a href="index.html" class="text-white me-3 text-decoration-none fw-bold" title="Go to home page">Home</a>
                <a href="events.html" class="text-white-50 me-3 text-decoration-none">Events</a>
                <a href="register.html" class="text-white-50 me-3 text-decoration-none">Register</a>
                <a href="gallery.html" class="text-white-50 me-3 text-decoration-none">Gallery</a>
                <a href="contact.html" class="text-white-50 text-decoration-none">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Part G4: Bootstrap Carousel -->
        <div id="eventCarousel" class="carousel slide mb-4" data-bs-ride="carousel">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <img src="media/banner1.jpg" class="d-block w-100" alt="Campus event banner 1">
                </div>
                <div class="carousel-item">
                    <img src="media/banner2.jpg" class="d-block w-100" alt="Campus event banner 2">
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#eventCarousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#eventCarousel" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>

        <!-- Main Content Container -->
        <div class="container py-2">
            <section id="welcome" class="intro mb-4 p-4 border rounded bg-light shadow-sm">
                <h2 class="h4 text-primary mb-3"><i class="fa-solid fa-house-user me-2"></i>Welcome</h2>
                <p class="lead fs-6">
                    The <strong>Events Hub</strong> lists every upcoming event at <em>Jigme Namgyel Engineering College</em>.
                    <span class="highlight text-danger fw-semibold" title="Registrations close 3 days before each event">Register early!</span>
                </p>
                <div class="mt-3">
                    <img src="media/campus.jpeg" alt="JNEC campus" class="img-fluid rounded shadow-sm" style="max-width: 500px;" title="Our campus in Dewathang">
                </div>
            </section>

            <section id="location" class="mb-4">
                <h2 class="h4 text-primary mb-3"><i class="fa-solid fa-map-location-dot me-2"></i>Find Us</h2>
                <div class="ratio ratio-16x9 rounded overflow-hidden border shadow-sm" style="max-width: 600px;">
                    <iframe src="https://www.openstreetmap.org/export/embed.html?bbox=91.44,26.85,91.48,26.88" title="Campus map" allowfullscreen></iframe>
                </div>
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white-50 text-center py-3 mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 JNEC Events Hub. All rights reserved.</p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
